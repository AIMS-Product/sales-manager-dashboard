name: Update shared Sales Manager viewer
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sales-manager-dashboard-publication
  cancel-in-progress: false
jobs:
  shared-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shared release consumer
        run: python3 scripts/install_shared_viewer.py --surface manager --output index.html
      - name: Publish viewer only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && exit 0
          git commit -m "Use verified shared Sales Manager release"
          git push origin HEAD:main
